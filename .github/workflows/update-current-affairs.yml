
name: Update IQ-Prep Current Affairs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-current-affairs.js"
      - ".github/workflows/update-current-affairs.yml"

permissions:
  contents: write

concurrency:
  group: current-affairs-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch RSS news
        run: node scripts/update-current-affairs.js

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-affairs.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Current Affairs from RSS"
            git push
          fi
