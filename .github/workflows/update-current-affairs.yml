
name: Update IQ-Prep Current Affairs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-affairs-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch RSS and create headline quizzes
        run: npm run update:current-affairs
        env:
          MAX_QUESTIONS_PER_RUN: "8"

      - name: Commit updated questions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-affairs.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Update Current Affairs from RSS"
            git push
          fi
